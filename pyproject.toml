[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "champollion-utils"
version = "0.1.0"
description = "Shared utilities for Champollion projects (ScriptBuilder, helpers, etc.)"
authors = [{ name = "Barthélémy Drabczuk", email = "barthelemy.drabczuk@cea.fr" }]
license = { text = "CeCILL" }
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "github.com/neurospin/champollion_utils"

[tool.hatch.build.targets.wheel]
packages = ["src/champollion_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
# The crash-hook tests run their scenario in a child python: measure it too.
patch = ["subprocess"]
parallel = true
